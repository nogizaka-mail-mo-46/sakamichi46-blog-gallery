<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Image Test</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 30px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
    </style>
</head>

<body>

<h1>Google Drive Image Test</h1>

<div class="gallery">

    <img src="https://drive.google.com/thumbnail?id=1UZoR1wZNgZsL5FoXBEVN-0ID6fqfJJcG&sz=w1000">
  
</div>

</body>
</html>
