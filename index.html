<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">

    <title>Google Drive Image Gallery</title>
</head>

<body>

<div class="header">
    <h1>Google Drive Image Gallery</h1>

    <a href="/auth/logout" class="logout-button">
        ログアウト
    </a>
</div>

<main>
    <select id="memberSelect">
        <option value="">メンバーを選択</option>
        <option value="yoshida_ayano_christie">吉田 綾乃クリスティー</option>
        <option value="member_02">メンバー02</option>
        <option value="member_03">メンバー03</option>
    </select>

    <select id="sortSelect">
        <option value="desc">新しい順</option>
        <option value="asc">古い順</option>
    </select>
    
    <div id="gallery" class="gallery"></div>
</main>


<!-- =========================
     拡大表示
========================= -->

<div id="lightbox" class="lightbox">

    <button
        id="closeButton"
        class="close-button"
        aria-label="閉じる"
    >
        ×
    </button>

    <button
        id="prevButton"
        class="nav-button prev-button"
        aria-label="前の画像"
    >
        ‹
    </button>

    <img
        id="lightboxImage"
        class="lightbox-image"
        src=""
        alt=""
    >

    <button
        id="nextButton"
        class="nav-button next-button"
        aria-label="次の画像"
    >
        ›
    </button>

    <div id="imageCounter" class="image-counter">
        1 / 1
    </div>

</div>

    <script src="/js/app.js"></script>
</body>
</html>
