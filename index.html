<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/calendar.css"
    >

    <link
        rel="stylesheet"
        href="/css/gallery.css"
    >

    <link
        rel="stylesheet"
        href="/css/member-icons.css"
    >

    <link
        rel="stylesheet"
        href="/css/blog-detail.css"
    >

    <link
        rel="stylesheet"
        href="/css/blog-images.css"
    >


    <!-- =========================
         favicon
    ========================= -->

    <link
        rel="icon"
        href="/images/favicon/favicon.svg"
        type="image/svg+xml"
    >

    <link
        rel="icon"
        href="/images/favicon/favicon.ico"
        sizes="any"
    >

    <link
        rel="apple-touch-icon"
        href="/images/favicon/apple-touch-icon.png"
    >


    <title>坂道グループブログギャラリー</title>
</head>

<body>

<main>


    <!-- =========================
         ギャラリー画面
    ========================= -->

    <div
        id="galleryView"
    >


        <!-- =========================
             ヒーロー
        ========================= -->

        <section
            id="hero"
            class="hero hero-nogizaka46"
        >

            <div
                id="heroBackgroundA"
                class="hero-background hero-background-a active"
            ></div>

            <div
                id="heroBackgroundB"
                class="hero-background hero-background-b"
            ></div>

            <div
                class="hero-overlay"
            ></div>


            <!-- =========================
                 ログアウト
            ========================= -->

            <a
                href="/auth/logout"
                class="hero-logout-button"
            >
                ログアウト
            </a>


            <div
                class="hero-content"
            >


                <!-- =========================
                     タイトル
                ========================= -->

                <div
                    class="hero-title-area"
                >

                    <h1
                        id="heroTitle"
                        class="hero-title"
                    >
                        乃木坂46
                    </h1>

                    <div
                        id="heroSubtitle"
                        class="hero-subtitle"
                    >
                        NOGIZAKA46 BLOG GALLERY
                    </div>

                </div>


                <!-- =========================
                     グループ切り替え
                ========================= -->

                <div
                    class="hero-group-buttons"
                    role="group"
                    aria-label="グループを選択"
                >

                    <button
                        type="button"
                        class="hero-group-button active"
                        data-group="nogizaka46"
                        aria-pressed="true"
                    >
                        乃木坂46
                    </button>

                    <button
                        type="button"
                        class="hero-group-button"
                        data-group="sakurazaka46"
                        aria-pressed="false"
                    >
                        櫻坂46
                    </button>

                    <button
                        type="button"
                        class="hero-group-button"
                        data-group="hinatazaka46"
                        aria-pressed="false"
                    >
                        日向坂46
                    </button>

                </div>

            </div>

        </section>


        <!-- =========================
             操作エリア
        ========================= -->

        <div
            class="gallery-controls"
        >


            <!-- =========================
                 メンバー選択
            ========================= -->

            <div
                class="member-sticky-area"
            >

                <div
                    id="memberIconSelector"
                    class="member-icon-selector"
                >

                    <div
                        id="memberIconTrack"
                        class="member-icon-track"
                        aria-label="メンバーを選択"
                    >
                    </div>

                </div>

            </div>


            <!-- =========================
                 メンバー内部選択
                 JSの状態管理用
            ========================= -->

            <select
                id="memberSelect"
                aria-label="メンバーを選択"
                hidden
            >
                <option
                    value=""
                >
                    メンバーを選択
                </option>
            </select>


            <!-- =========================
                 PC: カレンダー / ブログ 2カラム
                 タブレット・スマホ: 従来どおり縦並び
            ========================= -->

            <div
                class="gallery-main-layout"
            >

                <!-- =========================
                     カレンダー側
                ========================= -->

                <aside
                    class="gallery-calendar-column"
                >

                    <div
                        id="calendar"
                        class="calendar"
                    ></div>


                    <!-- =========================
                         ブログ検索
                         PC: 従来パネル
                         1023px以下: 検索条件ボタン
                    ========================= -->

                    <div class="blog-search-panel blog-search-panel-desktop">
                        <div class="blog-search-title">ブログを検索</div>

                        <div class="desktop-search-member">
                            <span class="desktop-search-label">メンバー</span>
                            <strong id="desktopSearchMemberValue">ALL</strong>
                        </div>

                        <div class="desktop-search-label">期間</div>
                        <div class="desktop-search-period">
                            <button type="button" id="desktopSearchStartDateButton" class="desktop-search-date-button">
                                <span>開始日</span><strong id="desktopSearchStartDateValue">未選択</strong>
                            </button>
                            <span class="desktop-search-period-separator">～</span>
                            <button type="button" id="desktopSearchEndDateButton" class="desktop-search-date-button">
                                <span>終了日</span><strong id="desktopSearchEndDateValue">未選択</strong>
                            </button>
                        </div>

                        <label class="desktop-search-label" for="desktopSearchKeywordInput">キーワード</label>
                        <input id="desktopSearchKeywordInput" type="search" class="blog-search-input" placeholder="キーワードを入力" aria-label="ブログ検索キーワード">

                        <div class="desktop-search-label">既読状態</div>
                        <div class="search-read-status-tabs" data-search-read-status-tabs="desktop" role="group" aria-label="既読状態">
                            <button type="button" class="search-read-status-tab is-active" data-read-status="all" aria-pressed="true">すべて</button>
                            <button type="button" class="search-read-status-tab" data-read-status="unread" aria-pressed="false">未読</button>
                            <button type="button" class="search-read-status-tab" data-read-status="read" aria-pressed="false">既読</button>
                        </div>

                        <button type="button" id="desktopExecuteSearchButton" class="blog-search-button">検索する</button>
                        <button type="button" id="desktopClearSearchButton" class="desktop-search-clear-button">条件をクリア</button>
                    </div>


                </aside>


                <!-- =========================
                     ブログ側
                ========================= -->

                <section
                    class="gallery-blog-column"
                >

                    <!-- =========================
                         ブログ一覧ヘッダー
                    ========================= -->

                    <div
                        class="blog-list-header"
                    >

                        <!-- =========================
                             選択中の日付
                        ========================= -->

                        <div
                            id="selectedDateTitle"
                            class="selected-date-title"
                        ></div>


                        <!-- =========================
                             検索条件 / 並び順
                        ========================= -->

                        <div class="blog-list-actions">
                            <button
                                type="button"
                                id="openSearchFiltersButton"
                                class="mobile-search-filter-button"
                                aria-label="検索条件を指定する"
                                aria-haspopup="dialog"
                                aria-controls="searchFilterSheet"
                            >
                                <span class="mobile-search-filter-icon" aria-hidden="true"></span>
                            </button>

                            <select
                                id="sortSelect"
                                aria-label="並び順を選択"
                            >
                                <option value="desc">新しい順</option>
                                <option value="asc">古い順</option>
                            </select>
                        </div>

                    </div>


                    <!-- =========================
                         ギャラリー
                    ========================= -->

                    <div
                        id="gallery"
                        class="gallery"
                    ></div>

                </section>

            </div>

        </div>

    </div>


    <!-- =========================
         ブログ詳細画面
    ========================= -->

    <div
        id="blogDetailView"
        class="blog-detail-view"
        hidden
    >

        <button
            id="blogDetailBackButton"
            type="button"
            class="ui-back-button blog-detail-back-button"
        >
            ← ギャラリーに戻る
        </button>

        <article
            id="blogDetail"
            class="blog-detail"
        >
        </article>

    </div>


    <!-- =========================
         ブログ画像一覧画面
    ========================= -->

    <div
        id="blogImagesView"
        class="blog-images-view"
        hidden
    >

        <button
            id="blogImagesBackButton"
            type="button"
            class="ui-back-button blog-images-back-button"
        >
            ← ギャラリーに戻る
        </button>

        <section
            id="blogImages"
            class="blog-images"
        >
        </section>

    </div>

</main>


<!-- =========================
     スマホ / タブレット縦: 検索条件シート
     ※ UIのみ。検索処理は未実装。
========================= -->

<div id="searchFilterBackdrop" class="search-filter-backdrop" hidden></div>

<section
    id="searchFilterSheet"
    class="search-filter-sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="searchFilterSheetTitle"
    hidden
>
    <div class="search-filter-sheet-handle" aria-hidden="true"></div>

    <div class="search-filter-sheet-header">
        <h2 id="searchFilterSheetTitle">検索条件を指定する</h2>
        <button type="button" id="closeSearchFiltersButton" class="search-filter-close-button" aria-label="閉じる">×</button>
    </div>

    <div class="search-filter-sheet-body">
        <button type="button" id="searchStartDateButton" class="search-filter-row">
            <span class="search-filter-row-icon" data-search-icon="calendar"></span>
            <span class="search-filter-row-label">開始日</span>
            <span id="searchStartDateValue" class="search-filter-row-value">未選択</span>
            <span class="search-filter-row-chevron">›</span>
        </button>

        <button type="button" id="searchEndDateButton" class="search-filter-row">
            <span class="search-filter-row-icon" data-search-icon="calendar"></span>
            <span class="search-filter-row-label">終了日</span>
            <span id="searchEndDateValue" class="search-filter-row-value">未選択</span>
            <span class="search-filter-row-chevron">›</span>
        </button>

        <div class="search-filter-row search-filter-member-row">
            <span class="search-filter-row-icon" data-search-icon="users"></span>
            <span class="search-filter-row-label">メンバー</span>
            <span id="searchMemberValue" class="search-filter-row-value">ALL</span>
        </div>

        <button type="button" id="searchKeywordToggleButton" class="search-filter-row" aria-expanded="false">
            <span class="search-filter-row-icon search-filter-search-icon" aria-hidden="true"></span>
            <span class="search-filter-row-label">キーワード</span>
            <span id="searchKeywordValue" class="search-filter-row-value">未設定</span>
            <span class="search-filter-row-chevron">›</span>
        </button>

        <div id="searchKeywordArea" class="search-filter-keyword-area" hidden>
            <input
                type="search"
                id="searchKeywordInput"
                class="search-filter-keyword-input"
                placeholder="キーワードを入力"
                aria-label="検索キーワード"
            >
        </div>

        <button type="button" id="searchReadStatusButton" class="search-filter-row">
            <span class="search-filter-row-icon search-filter-read-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </span>
            <span class="search-filter-row-label">既読状態</span>
            <span id="searchReadStatusValue" class="search-filter-row-value">すべて</span>
            <span class="search-filter-row-chevron">›</span>
        </button>
    </div>

    <div class="search-filter-sheet-footer">
        <button type="button" id="executeSearchButton" class="search-filter-execute-button">この条件で検索</button>
        <button type="button" id="clearSearchFiltersButton" class="search-filter-clear-button">条件をクリア</button>
    </div>
</section>

<!-- =========================
     既読状態 選択
========================= -->
<div id="searchReadStatusBackdrop" class="search-read-status-backdrop" hidden></div>

<section id="searchReadStatusPicker" class="search-read-status-picker" aria-modal="true" aria-labelledby="searchReadStatusPickerTitle" hidden>
    <div class="search-read-status-picker-handle" aria-hidden="true"></div>
    <div class="search-read-status-picker-header">
        <h2 id="searchReadStatusPickerTitle">既読状態</h2>
        <button type="button" id="closeSearchReadStatusPickerButton" class="search-read-status-picker-close" aria-label="既読状態の選択を閉じる">×</button>
    </div>
    <div class="search-read-status-options" data-search-read-status-tabs="mobile" role="radiogroup" aria-label="既読状態">
        <button type="button" class="search-read-status-option is-active" data-read-status="all" role="radio" aria-checked="true">
            <span>すべて</span><span class="search-read-status-check">✓</span>
        </button>
        <button type="button" class="search-read-status-option" data-read-status="unread" role="radio" aria-checked="false">
            <span>未読</span><span class="search-read-status-check">✓</span>
        </button>
        <button type="button" class="search-read-status-option" data-read-status="read" role="radio" aria-checked="false">
            <span>既読</span><span class="search-read-status-check">✓</span>
        </button>
    </div>
</section>

<!-- =========================
     開始日 / 終了日 選択カレンダー
========================= -->

<div id="searchDatePickerBackdrop" class="search-date-picker-backdrop" hidden></div>

<section
    id="searchDatePicker"
    class="search-date-picker"
    role="dialog"
    aria-modal="true"
    aria-labelledby="searchDatePickerTitle"
    hidden
>
    <div class="search-date-picker-header">
        <h2 id="searchDatePickerTitle">開始日を選択</h2>
        <button type="button" id="closeSearchDatePickerButton" class="search-filter-close-button" aria-label="閉じる">×</button>
    </div>

    <div class="search-date-picker-month-nav">
        <button type="button" id="searchDateFirstMonth" class="search-date-month-button search-date-month-edge" aria-label="一番古い投稿月へ" title="一番古い投稿月へ">≪</button>
        <button type="button" id="searchDatePrevMonth" class="search-date-month-button" aria-label="前の投稿月へ" title="前の投稿月へ">‹</button>
        <button type="button" id="searchDateMonthTitle" class="search-date-month-title-button" aria-label="年月を選択" aria-expanded="false"></button>
        <button type="button" id="searchDateNextMonth" class="search-date-month-button" aria-label="次の投稿月へ" title="次の投稿月へ">›</button>
        <button type="button" id="searchDateLastMonth" class="search-date-month-button search-date-month-edge" aria-label="一番新しい投稿月へ" title="一番新しい投稿月へ">≫</button>
    </div>

    <div id="searchDateMonthPicker" class="calendar-month-picker search-date-month-picker" hidden>
        <div class="calendar-month-picker-header search-date-month-picker-header">
            <button type="button" id="searchDateMonthPickerPrevYear" class="ui-icon-button calendar-month-picker-nav search-date-month-picker-year-nav" aria-label="前の投稿年">‹</button>
            <strong id="searchDateMonthPickerYear" class="calendar-month-picker-year"></strong>
            <button type="button" id="searchDateMonthPickerNextYear" class="ui-icon-button calendar-month-picker-nav search-date-month-picker-year-nav" aria-label="次の投稿年">›</button>
        </div>
        <div id="searchDateMonthPickerGrid" class="calendar-month-picker-grid search-date-month-picker-grid"></div>
    </div>

    <div class="search-date-weekdays" aria-hidden="true">
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
    </div>

    <div id="searchDateGrid" class="search-date-grid"></div>

    <div class="search-date-picker-footer">
        <button type="button" id="unsetSearchDateButton" class="search-date-unset-button">未選択にする</button>
        <button type="button" id="confirmSearchDateButton" class="search-date-confirm-button">決定</button>
    </div>
</section>

<!-- =========================
     拡大表示
========================= -->

<div
    id="lightbox"
    class="lightbox"
>

    <button
        id="closeButton"
        class="close-button"
        aria-label="閉じる"
    >
        ×
    </button>

    <button
        id="prevButton"
        class="nav-button prev-button"
        aria-label="前の画像"
    >
        ‹
    </button>

    <div
        class="lightbox-content"
    >

        <img
            id="lightboxImage"
            class="lightbox-image"
            src=""
            alt=""
            draggable="false"
        >

        <div
            id="imageCounter"
            class="image-counter"
        >
            1 / 1
        </div>

        <div
            id="lightboxThumbnails"
            class="lightbox-thumbnails"
            aria-label="画像一覧"
        >
        </div>

    </div>

    <button
        id="nextButton"
        class="nav-button next-button"
        aria-label="次の画像"
    >
        ›
    </button>

</div>


<script
    type="module"
    src="/js/app.js"
></script>

</body>
</html>
