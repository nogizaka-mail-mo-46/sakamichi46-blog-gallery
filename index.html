<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>坂道グループ ブログ ギャラリー</title>

<style>
  body {
    font-family: sans-serif;
    margin: 0;
    background: #fafafa;
  }

  /* ===== グループタブ ===== */
  .group-tabs {
    display: flex;
    overflow-x: auto;
    white-space: nowrap;
    background: #fff;
    border-bottom: 1px solid #ddd;
  }

  .group-tab {
    padding: 14px 20px;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    text-align: center;
    transition: filter 0.2s;
  }

  .nogizaka { background: #7d2c8e; }
  .sakurazaka { background: #e8a2c8; }
  .hinatazaka { background: #7fcff4; }

  .group-tab.active {
    filter: brightness(0.85);
  }

  /* ===== メンバー選択 ===== */
  #memberSelect {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin-top: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: #fff;
  }

  /* ===== カレンダー ===== */
  #calendar {
    margin: 10px;
    background: #fff;
    border-radius: 8px;
    padding: 10px;
    border: 1px solid #ddd;
  }

  #calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 10px;
  }

  #calendar-header select {
    padding: 6px;
    font-size: 14px;
  }

  #calendar-header button {
    padding: 6px 10px;
    font-size: 14px;
  }

  #weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    margin-bottom: 6px;
    font-weight: bold;
  }

  .weekday {
    padding: 6px 0;
  }

  .sun { color: red; }
  .sat { color: blue; }

  #calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    text-align: center;
  }

  .day {
    padding: 10px 0;
    border-radius: 6px;
    cursor: pointer;
  }

  .day:hover {
    background: #eee;
  }

  .selected-day {
    background: #007bff;
    color: #fff;
  }

  .holiday {
    color: red;
  }

  .holiday-bg {
    background: #ffe5e5; /* 祝日背景色（淡い赤） */
  }

  /* ===== メイン表示領域 ===== */
  #content {
    padding: 20px;
    font-size: 18px;
  }
</style>
</head>

<body>

<!-- ===== グループ選択 ===== -->
<div class="group-tabs">
  <div class="group-tab nogizaka active" data-group="nogizaka">乃木坂46</div>
  <div class="group-tab sakurazaka" data-group="sakurazaka">櫻坂46</div>
  <div class="group-tab hinatazaka" data-group="hinatazaka">日向坂46</div>
</div>

<!-- ===== メンバー選択 ===== -->
<select id="memberSelect">
  <option value="">メンバーを選択してください</option>
</select>

<!-- ===== カレンダー ===== -->
<div id="calendar">

  <div id="calendar-header">
    <button id="prevMonth">←</button>

    <select id="yearSelect"></select>
    <select id="monthSelect"></select>

    <button id="nextMonth">→</button>
  </div>

  <div id="weekday-row">
    <div class="weekday sun">日</div>
    <div class="weekday">月</div>
    <div class="weekday">火</div>
    <div class="weekday">水</div>
    <div class="weekday">木</div>
    <div class="weekday">金</div>
    <div class="weekday sat">土</div>
  </div>

  <div id="calendar-grid"></div>
</div>

<!-- ===== メイン表示領域 ===== -->
<div id="content"></div>

<!-- ===== 外部 JS 読み込み ===== -->
<script src="js/holidays.js"></script>
<script src="js/calendar.js"></script>
<script src="js/members.js"></script>
<script src="js/nogizaka.js"></script>
<script src="js/sakurazaka.js"></script>
<script src="js/hinatazaka.js"></script>

<script>
  // ===== index.html が担当するのは UI のみ =====

  // 初期表示：乃木坂
  updateMemberSelect("nogizaka");

  // グループ切り替え
  document.querySelectorAll(".group-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".group-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");

      const group = tab.dataset.group;
      updateMemberSelect(group);

      document.getElementById("content").textContent = "";
      resetCalendarSelection();
    });
  });

  // メンバー選択
  function updateMemberSelect(group) {
    const select = document.getElementById("memberSelect");
    select.innerHTML = '<option value="">メンバーを選択してください</option>';

    MEMBERS[group].forEach(name => {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      select.appendChild(option);
    });
  }

  // メンバー選択時の表示
  document.getElementById("memberSelect").addEventListener("change", function() {
    const name = this.value;
    const content = document.getElementById("content");

    if (name) {
      content.textContent = `${name} のブログ画像一覧`;
    } else {
      content.textContent = "";
    }
  });

  // カレンダー初期化（calendar.js 内の関数）
  initCalendar();
</script>

</body>
</html>
