<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/calendar.css"
    >

    <link
        rel="stylesheet"
        href="/css/gallery.css"
    >

    <link
        rel="stylesheet"
        href="/css/member-icons.css"
    >

    <link
        rel="stylesheet"
        href="/css/blog-detail.css"
    >

    <link
        rel="stylesheet"
        href="/css/blog-images.css"
    >

    <title>坂道グループブログギャラリー</title>
</head>

<body>

<main>


    <!-- =========================
         ギャラリー画面
    ========================= -->

    <div
        id="galleryView"
    >


        <!-- =========================
             ヒーロー
        ========================= -->

        <section
            id="hero"
            class="hero hero-nogizaka46"
        >

            <div
                id="heroBackgroundA"
                class="hero-background hero-background-a active"
            ></div>

            <div
                id="heroBackgroundB"
                class="hero-background hero-background-b"
            ></div>

            <div
                class="hero-overlay"
            ></div>


            <!-- =========================
                 ログアウト
            ========================= -->

            <a
                href="/auth/logout"
                class="hero-logout-button"
            >
                ログアウト
            </a>


            <div
                class="hero-content"
            >


                <!-- =========================
                     タイトル
                ========================= -->

                <div
                    class="hero-title-area"
                >

                    <h1
                        id="heroTitle"
                        class="hero-title"
                    >
                        乃木坂46
                    </h1>

                    <div
                        id="heroSubtitle"
                        class="hero-subtitle"
                    >
                        NOGIZAKA46 BLOG GALLERY
                    </div>

                </div>


                <!-- =========================
                     グループ切り替え
                ========================= -->

                <div
                    class="hero-group-buttons"
                    role="group"
                    aria-label="グループを選択"
                >

                    <button
                        type="button"
                        class="hero-group-button active"
                        data-group="nogizaka46"
                        aria-pressed="true"
                    >
                        乃木坂46
                    </button>

                    <button
                        type="button"
                        class="hero-group-button"
                        data-group="sakurazaka46"
                        aria-pressed="false"
                    >
                        櫻坂46
                    </button>

                    <button
                        type="button"
                        class="hero-group-button"
                        data-group="hinatazaka46"
                        aria-pressed="false"
                    >
                        日向坂46
                    </button>

                </div>

            </div>

        </section>


        <!-- =========================
             操作エリア
        ========================= -->

        <div
            class="gallery-controls"
        >


            <!-- =========================
                 メンバー選択
            ========================= -->

            <div
                id="memberIconSelector"
                class="member-icon-selector"
            >

                <div
                    id="memberIconTrack"
                    class="member-icon-track"
                    aria-label="メンバーを選択"
                >
                </div>

            </div>


            <!-- =========================
                 メンバー内部選択
                 JSの状態管理用
            ========================= -->

            <select
                id="memberSelect"
                aria-label="メンバーを選択"
                hidden
            >
                <option
                    value=""
                >
                    メンバーを選択
                </option>
            </select>


            <!-- =========================
                 PC: カレンダー / ブログ 2カラム
                 タブレット・スマホ: 従来どおり縦並び
            ========================= -->

            <div
                class="gallery-main-layout"
            >

                <!-- =========================
                     カレンダー側
                ========================= -->

                <aside
                    class="gallery-calendar-column"
                >

                    <div
                        id="calendar"
                        class="calendar"
                    ></div>

                </aside>


                <!-- =========================
                     ブログ側
                ========================= -->

                <section
                    class="gallery-blog-column"
                >

                    <!-- =========================
                         ブログ一覧ヘッダー
                    ========================= -->

                    <div
                        class="blog-list-header"
                    >

                        <!-- =========================
                             選択中の日付
                        ========================= -->

                        <div
                            id="selectedDateTitle"
                            class="selected-date-title"
                        ></div>


                        <!-- =========================
                             並び順
                        ========================= -->

                        <select
                            id="sortSelect"
                            aria-label="並び順を選択"
                        >
                            <option
                                value="desc"
                            >
                                新しい順
                            </option>

                            <option
                                value="asc"
                            >
                                古い順
                            </option>
                        </select>

                    </div>


                    <!-- =========================
                         ギャラリー
                    ========================= -->

                    <div
                        id="gallery"
                        class="gallery"
                    ></div>

                </section>

            </div>

        </div>

    </div>


    <!-- =========================
         ブログ詳細画面
    ========================= -->

    <div
        id="blogDetailView"
        class="blog-detail-view"
        hidden
    >

        <button
            id="blogDetailBackButton"
            type="button"
            class="blog-detail-back-button"
        >
            ← ギャラリーに戻る
        </button>

        <article
            id="blogDetail"
            class="blog-detail"
        >
        </article>

    </div>


    <!-- =========================
         ブログ画像一覧画面
    ========================= -->

    <div
        id="blogImagesView"
        class="blog-images-view"
        hidden
    >

        <button
            id="blogImagesBackButton"
            type="button"
            class="blog-images-back-button"
        >
            ← ギャラリーに戻る
        </button>

        <section
            id="blogImages"
            class="blog-images"
        >
        </section>

    </div>

</main>


<!-- =========================
     拡大表示
========================= -->

<div
    id="lightbox"
    class="lightbox"
>

    <button
        id="closeButton"
        class="close-button"
        aria-label="閉じる"
    >
        ×
    </button>

    <button
        id="prevButton"
        class="nav-button prev-button"
        aria-label="前の画像"
    >
        ‹
    </button>

    <div
        class="lightbox-content"
    >

        <img
            id="lightboxImage"
            class="lightbox-image"
            src=""
            alt=""
            draggable="false"
        >

        <div
            id="imageCounter"
            class="image-counter"
        >
            1 / 1
        </div>

        <div
            id="lightboxThumbnails"
            class="lightbox-thumbnails"
            aria-label="画像一覧"
        >
        </div>

    </div>

    <button
        id="nextButton"
        class="nav-button next-button"
        aria-label="次の画像"
    >
        ›
    </button>

</div>


<script
    type="module"
    src="/js/app.js"
></script>

</body>
</html>
