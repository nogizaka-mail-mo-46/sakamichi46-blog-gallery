<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>坂道グループ ブログ ギャラリー</title>

<style>
  body {
    font-family: sans-serif;
    margin: 0;
    background: #fafafa;
  }

  /* 上段グループタブ */
  .group-tabs {
    display: flex;
    overflow-x: auto;
    white-space: nowrap;
    background: #fff;
    border-bottom: 1px solid #ddd;
  }

  .group-tab {
    padding: 14px 20px;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    text-align: center;
    transition: filter 0.2s;
  }

  .nogizaka { background: #7d2c8e; }
  .sakurazaka { background: #e8a2c8; }
  .hinatazaka { background: #7fcff4; }

  .group-tab.active {
    filter: brightness(0.85);
  }

  /* メンバー選択プルダウン */
  #memberSelect {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin-top: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: #fff;
  }

  /* カレンダー */
  #calendar {
    margin: 10px;
    background: #fff;
    border-radius: 8px;
    padding: 10px;
    border: 1px solid #ddd;
  }

  #calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  #calendar-header button {
    padding: 6px 10px;
    font-size: 14px;
  }

  #calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    text-align: center;
  }

  .day {
    padding: 10px 0;
    border-radius: 6px;
    cursor: pointer;
  }

  .day:hover {
    background: #eee;
  }

  .selected-day {
    background: #007bff;
    color: #fff;
  }

  /* メイン表示領域 */
  #content {
    padding: 20px;
    font-size: 18px;
  }
</style>
</head>

<body>

<!-- 上段：グループ選択 -->
<div class="group-tabs">
  <div class="group-tab nogizaka active" data-group="nogizaka">乃木坂46</div>
  <div class="group-tab sakurazaka" data-group="sakurazaka">櫻坂46</div>
  <div class="group-tab hinatazaka" data-group="hinatazaka">日向坂46</div>
</div>

<!-- メンバー選択（プルダウン） -->
<select id="memberSelect">
  <option value="">メンバーを選択してください</option>
</select>

<!-- カレンダー（視覚的 UI） -->
<div id="calendar">
  <div id="calendar-header">
    <button id="prevMonth">←</button>
    <div id="monthLabel"></div>
    <button id="nextMonth">→</button>
  </div>
  <div id="calendar-grid"></div>
</div>

<!-- メイン表示領域 -->
<div id="content"></div>

<script>
  // ====== メンバー一覧 ======

  const members = {
    nogizaka: [
      "伊藤理々杏","岩本蓮加","吉田綾乃クリスティー",
      "遠藤さくら","賀喜遥香","金川紗耶","黒見明香","柴田柚菜","田村真佑","筒井あやめ","林瑠奈","弓木奈於",
      "五百城茉央","池田瑛紗","一ノ瀬美空","井上和","岡本姫奈","小川彩","奥田いろは","川﨑桜","菅原咲月","冨里奈央","中西アルノ",
      "愛宕心響","大越ひなの","小津玲奈","海邉朱莉","川端晃菜","鈴木佑捺","瀬戸口心月","長嶋凛桜","増田三莉音","森平麗心","矢田萌華"
    ],

    sakurazaka: [
      "遠藤光莉","大園玲","大沼晶保","幸阪茉里乃","田村保乃","藤吉夏鈴","増本綺良","松田里奈","森田ひかる","守屋麗奈","山﨑天",
      "石森璃花","遠藤理子","小田倉麗奈","小島凪紗","谷口愛季","中嶋優月","的野美青","向井純葉","村井優","村山美羽","山下瞳月",
      "浅井恋乃未","稲熊ひな","勝又春","佐藤愛桜","中川智尋","松本和子","目黒陽色","山川宇衣","山田桃実"
    ],

    hinatazaka: [
      "金村美玖","小坂菜緒",
      "上村ひなの","髙橋未来虹","森本茉莉","山口陽世",
      "石塚瑶季","小西夏菜実","清水理央","正源司陽子","竹内希来里","平尾帆夏","平岡海月","藤嶌果歩","宮地すみれ","山下葉留花","渡辺莉奈",
      "大田美月","大野愛実","片山紗希","蔵盛妃那乃","坂井新奈","佐藤優羽","下田衣珠季","高井俐香","鶴崎仁香","松尾桜"
    ]
  };

  // ====== 初期表示：乃木坂46 ======
  updateMemberSelect("nogizaka");

  // ====== グループタブ切り替え ======
  document.querySelectorAll(".group-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".group-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");

      const group = tab.dataset.group;
      updateMemberSelect(group);

      document.getElementById("content").textContent = "";
      selectedDate = null;
      renderCalendar(currentYear, currentMonth);
    });
  });

  // ====== メンバー選択プルダウン更新 ======
  function updateMemberSelect(group) {
    const select = document.getElementById("memberSelect");
    select.innerHTML = '<option value="">メンバーを選択してください</option>';

    members[group].forEach(name => {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      select.appendChild(option);
    });
  }

  // ====== メンバー選択時の表示 ======
  document.getElementById("memberSelect").addEventListener("change", function() {
    const name = this.value;
    const content = document.getElementById("content");

    if (name) {
      content.textContent = `${name} のブログ画像一覧`;
    } else {
      content.textContent = "";
    }
  });

  // ====== カレンダー生成 ======

  let currentDate = new Date();
  let currentYear = currentDate.getFullYear();
  let currentMonth = currentDate.getMonth();
  let selectedDate = null;

  function renderCalendar(year, month) {
    const monthLabel = document.getElementById("monthLabel");
    const grid = document.getElementById("calendar-grid");
    grid.innerHTML = "";

    monthLabel.textContent = `${year}年 ${month + 1}月`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement("div");
      grid.appendChild(empty);
    }

    for (let day = 1; day <= lastDate; day++) {
      const div = document.createElement("div");
      div.className = "day";
      div.textContent = day;

      div.addEventListener("click", () => {
        document.querySelectorAll(".day").forEach(d => d.classList.remove("selected-day"));
        div.classList.add("selected-day");

        selectedDate = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

        const member = document.getElementById("memberSelect").value;
        const content = document.getElementById("content");

        if (member) {
          content.textContent = `${member} の ${selectedDate} のブログ画像一覧`;
        }
      });

      grid.appendChild(div);
    }
  }

  document.getElementById("prevMonth").addEventListener("click", () => {
    currentMonth--;
    if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
    }
    renderCalendar(currentYear, currentMonth);
  });

  document.getElementById("nextMonth").addEventListener("click", () => {
    currentMonth++;
    if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
    }
    renderCalendar(currentYear, currentMonth);
  });

  renderCalendar(currentYear, currentMonth);
</script>

</body>
</html>
